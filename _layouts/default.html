<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#12162d" />
  <meta name="referrer" content="no-referrer" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'none'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; script-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none';"
  />
  <meta name="description" content="{{ page.description | default: site.description | escape }}" />
  <link rel="canonical" href="https://shamsgolap.github.io/vayvi-privacy/" />
  <link rel="stylesheet" href="{{ '/assets/css/privacy.css' | relative_url }}" />
  <title>{{ page.title | default: site.title | escape }}</title>
</head>
<body>
  <header class="site-header">
    <div class="shell">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="Vayvi — Politique de confidentialité">
        <span class="brand-mark" aria-hidden="true">V</span>
        <span>Vayvi</span>
      </a>

      <div class="hero">
        <span class="kicker">Confidentialité</span>
        <h1>Politique de confidentialité</h1>
        <p>Cette page explique quelles données Vayvi utilise, où elles sont conservées, quels services tiers interviennent et quels sont tes choix.</p>
      </div>
    </div>
  </header>

  <main class="shell">
    <article class="policy">
      {{ content }}
    </article>
  </main>

  <footer class="site-footer">
    <div class="shell site-footer-inner">
      <span>Vayvi · GolApp Studio</span>
      <a href="mailto:golappstudio.support@gmail.com">golappstudio.support@gmail.com</a>
    </div>
  </footer>
</body>
</html>
